app = 'daniz-sniff-items'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # keep 256mb: the bill stays under the 5 dollars Fly does not collect (512mb would be ~4.4 dollars alone)
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'sniff_data'
  destination = '/app/data'
