# Every push to master deploys the server to Fly.io (app daniz-sniff-items).
# Needs the repository secret FLY_API_TOKEN (a deploy token of the app).
name: Deploy to Fly.io
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy-fly

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
